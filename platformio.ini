; M5Stack StopWatch (ESP32-S3R8, 16MB Flash / 8MB OPI PSRAM, 1.75" 466x466 AMOLED)
; Geometric Bot mark digital badge firmware
;
; ビルド:   pio run
; 書き込み: pio run -t upload      (USB-C 接続。ポートは自動検出)
; シリアル: pio device monitor     (115200bps, USB CDC)

[platformio]
default_envs = m5stopwatch

[env:m5stopwatch]
build_src_filter = +<*> -<diag/>
extra_scripts = pre:tools/platformio_secret_scan.py
; pioarduino (Arduino-ESP32 3.x / ESP-IDF 5.4 ベース)。M5GFX の StopWatch 対応は Arduino core 3.x を前提にしています。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- StopWatch のメモリ構成 (ESP32-S3R8: QIO Flash 16MB + Octal PSRAM 8MB) ---
; M5GFX は OPI-PSRAM が有効な場合のみ AMOLED 用フレームバッファを確保します。
; ここを間違えると「画面は出るが文字が崩れる / 描画が乱れる」症状になります。
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3

; PlatformIO レジストリが使える環境なら以下 2 行でも可:
;   m5stack/M5GFX@^0.2.28
;   m5stack/M5Unified@^0.2.21
lib_deps =
  https://github.com/m5stack/M5GFX.git#0.2.28
  https://github.com/m5stack/M5Unified.git#0.2.21
  h2zero/NimBLE-Arduino@^2.1.0
  ricmoo/QRCode@^0.0.1
  bblanchon/ArduinoJson@^7.0.0

monitor_speed = 115200
upload_speed = 921600

; 診断用 (画面ずれ / IMU 軸の確認)。pio run -e diag -t upload
[env:diag]
extends = env:m5stopwatch
build_src_filter = -<*> +<diag/>
